<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — IT Helpdesk</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:2rem;width:100%;max-width:380px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
  .logo-icon{width:40px;height:40px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
  h1{font-size:16px;font-weight:600;color:#1a1a1a}
  p.sub{font-size:13px;color:#888;margin-top:2px}
  .tabs{display:flex;gap:4px;background:#f5f5f0;border-radius:8px;padding:4px;margin-bottom:1.5rem}
  .tab{flex:1;padding:7px;border:none;background:transparent;border-radius:6px;font-size:13px;cursor:pointer;color:#888;font-family:inherit;transition:all .15s}
  .tab.active{background:#fff;color:#1a1a1a;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  label{display:block;font-size:12px;color:#666;margin-bottom:5px}
  input,select{width:100%;border:1px solid #e5e5e0;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;margin-bottom:12px;outline:none;transition:border .15s;background:#fff}
  input:focus,select:focus{border-color:#1a1a1a}
  .btn{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px}
  .btn:hover{opacity:.85}
  .err{font-size:13px;color:#c0392b;background:#fdf0f0;border:1px solid #f5c6c6;border-radius:6px;padding:8px 12px;margin-bottom:12px;display:none}
  .pane{display:none}
  .pane.active{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M9 12h6m-3-3v6M12 3a9 9 0 100 18A9 9 0 0012 3z"/></svg>
    </div>
    <div>
      <h1>IT Helpdesk</h1>
      <p class="sub">Sistem tiket permintaan IT</p>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Masuk</button>
    <button class="tab" onclick="switchTab('register')">Daftar</button>
  </div>
  <div id="err" class="err"></div>
  <div id="pane-login" class="pane active">
    <label>Username</label>
    <input type="text" id="l-user" placeholder="username">
    <label>Password</label>
    <input type="password" id="l-pass" placeholder="password">
    <button class="btn" onclick="doLogin()">Masuk</button>
  </div>
  <div id="pane-register" class="pane">
    <label>Nama Lengkap</label>
    <input type="text" id="r-nama" placeholder="Nama lengkap">
    <label>Username</label>
    <input type="text" id="r-user" placeholder="username">
    <label>Departemen</label>
    <select id="r-dept">
      <option value="">Pilih departemen</option>
      <option>Finance</option><option>HR</option><option>IT</option>
      <option>Marketing</option><option>Operasional</option><option>Sales</option>
    </select>
    <label>Password</label>
    <input type="password" id="r-pass" placeholder="Min. 6 karakter">
    <button class="btn" onclick="doRegister()">Daftar Akun</button>
  </div>
</div>
<script>
function switchTab(tab) {
  var tabs = document.querySelectorAll('.tab');
  tabs[0].classList.toggle('active', tab === 'login');
  tabs[1].classList.toggle('active', tab === 'register');
  document.getElementById('pane-login').classList.toggle('active', tab === 'login');
  document.getElementById('pane-register').classList.toggle('active', tab === 'register');
  showErr('');
}
function showErr(msg) {
  var e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = msg ? 'block' : 'none';
}
function doLogin() {
  var username = document.getElementById('l-user').value.trim();
  var password = document.getElementById('l-pass').value;
  if (!username || !password) return showErr('Isi username dan password');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/login');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    var d = JSON.parse(xhr.responseText);
    if (xhr.status !== 200) return showErr(d.error);
    window.location.href = '/';
  };
  xhr.onerror = function() { showErr('Gagal terhubung ke server'); };
  xhr.send(JSON.stringify({username: username, password: password}));
}
function doRegister() {
  var nama = document.getElementById('r-nama').value.trim();
  var username = document.getElementById('r-user').value.trim();
  var departemen = document.getElementById('r-dept').value;
  var password = document.getElementById('r-pass').value;
  if (!nama || !username || !password) return showErr('Semua field wajib diisi');
  if (password.length < 6) return showErr('Password minimal 6 karakter');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/register');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    var d = JSON.parse(xhr.responseText);
    if (xhr.status !== 200) return showErr(d.error);
    alert('Akun berhasil dibuat! Silakan masuk.');
    switchTab('login');
  };
  xhr.onerror = function() { showErr('Gagal terhubung ke server'); };
  xhr.send(JSON.stringify({nama: nama, username: username, departemen: departemen, password: password}));
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (document.getElementById('pane-login').classList.contains('active')) doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
